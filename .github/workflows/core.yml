            python3 -B -m unittest discover -s tests -p test_maintenance_model_blockers.py -v
      - name: Record digest evidence for an original witnessed format 94 Unknown
        run: |
          mkdir "$RUNNER_TEMP/psios-format94"
          git archive 4b07bebca8563de38e885a09051dbac7f9b8b55a Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format94"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format94" "$RUNNER_TEMP/psios-compatibility-target"
          python3 -B tests/model_late_decision_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
          PSIOS_TEST_COMPACTION_PREVIOUS="$RUNNER_TEMP/psios-compatibility-target/debug" \
            python3 -B -m unittest discover -s tests -p test_state_compaction.py -k test_offline_compaction -v
      - name: Preserve format 95 submitted and legacy prepared work when bounding new preparations
        run: |
          mkdir "$RUNNER_TEMP/psios-format95"
          git archive c402b948c6a3cf7c2be678207fce2d2c383218a9 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format95"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format95" "$RUNNER_TEMP/psios-compatibility-target"
          PSIOS_PRIOR_BIN_DIR="$RUNNER_TEMP/psios-compatibility-target/debug" \
            python3 -B -m unittest discover -s tests -p test_task_preparation.py -k test_format95 -v
          PSIOS_LEGACY_INPUT_BIN_DIR="$RUNNER_TEMP/psios-compatibility-target/debug" \
            python3 -B -m unittest discover -s tests -p test_retained_input_inventory.py -k test_inventory_distinguishes -v
      - name: Reclaim already revoked preparations on startup of the new daemon
        run: |
          mkdir "$RUNNER_TEMP/psios-preparation-before-sweep"
          git archive d38f0bbba1c5714c36e79d36c4e8115875dfe986 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-preparation-before-sweep"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-preparation-before-sweep" "$RUNNER_TEMP/psios-compatibility-target"
          PSIOS_PREPARATION_PRIOR_BIN_DIR="$RUNNER_TEMP/psios-compatibility-target/debug" \
            python3 -B -m unittest discover -s tests -p test_task_preparation_revocation.py -k test_startup -v
  oci-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build the current and previous Core
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          cargo +1.100.0 build --locked --workspace
          mkdir "$RUNNER_TEMP/psios-format60"
          git archive 1d41b3ef3c01b67a5064725f8824fe5023c28404 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format60"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format60" "$RUNNER_TEMP/psios-compatibility-target"
      - name: Preserve format 60 signed admission and published model output during OCI capture migration
        run: python3 -B tests/release_retirement_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug" --previous-format 60
      - name: Capture and independently reload an exact local OCI image archive
        run: python3 -B tests/oci_capture.py
      - name: Restore a signed release archive and reconcile a real Docker request after process loss
        run: python3 -B tests/oci_restore.py
      - name: Verify explicitly approved larger capture and detached checkpoint through real Docker restore
        run: python3 -B tests/oci_capacity.py
      - name: Keep approved captures queued while real Docker saves occupy the staging budget
        run: python3 -B tests/oci_capture_staging.py

  host-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install package build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends debhelper
          rustup show active-toolchain
      - name: Build the original packaged Core and the current package
        run: |
          # The historical test harness forks while other tests own locks.
          RUST_TEST_THREADS=1 tools/build-host-package "$RUNNER_TEMP/psios-previous-package" 73421114b0a2751bb89b6ab95873fcda5d3ef85f
          tools/build-host-package "$RUNNER_TEMP/psios-package"
      - name: Exercise the installed system service across a real package upgrade
        run: |
          (cd "$RUNNER_TEMP/psios-package" && sha256sum -c SHA256SUMS)
          sudo tests/debian-install.sh --disposable-systemd-host \
            "$RUNNER_TEMP"/psios-previous-package/psios-core_*.deb "$RUNNER_TEMP"/psios-package/psios-core_*.deb
      - name: Retain the tested amd64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package/
          if-no-files-found: error
          retention-days: 14

  guest-boot:
    needs: host-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package
      - name: Prepare the pinned guest base and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage seabios ovmf acl
          if [ -c /dev/kvm ]; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          (cd "$RUNNER_TEMP/psios-package" && sha256sum -c SHA256SUMS)
          curl --fail --location --retry 3 "$(jq -r .url images/qemu/base.json)" -o "$RUNNER_TEMP/base.img"
      - name: Boot BIOS and UEFI nodes and recover after abrupt VM loss
        run: python3 tests/qemu_boot.py --base "$RUNNER_TEMP/base.img" --package "$RUNNER_TEMP"/psios-package/psios-core_*.deb

  native-virtio-install:
    needs: host-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package
      - name: Prepare pinned installer inputs
        run: |
          sudo timeout 180 apt-get update -q
          sudo timeout 240 apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage \
            seabios ovmf grub-common grub-efi-amd64-bin cpio dosfstools e2fsprogs fdisk mtools
          (cd "$RUNNER_TEMP/psios-package" && sha256sum --strict --check SHA256SUMS)
          curl --fail --location --retry 3 "$(jq -r .url images/qemu/base.json)" -o "$RUNNER_TEMP/base.img"
          curl --fail --location --retry 3 "$(jq -r .url images/rescue/base.json)" -o "$RUNNER_TEMP/kernel.iso"
          mkdir "$RUNNER_TEMP/installer-tools"
          (cd "$RUNNER_TEMP/installer-tools" && apt-get download fdisk mtools)
          tools/build-portable-core "$RUNNER_TEMP/native-core.tar.gz"
      - name: Install onto a real virtio device in an isolated Linux guest and reboot the installed disk
        run: |
          archive="$RUNNER_TEMP/native-core.tar.gz"
          tool_args=()
          for tool in "$RUNNER_TEMP"/installer-tools/*.deb; do tool_args+=(--tool-deb "$tool"); done
          python3 -B tests/native_install_virtio.py --base "$RUNNER_TEMP/base.img" \
            --package "$RUNNER_TEMP"/psios-package/psios-core_*.deb \
            --archive "$archive" --archive-sha256 "$(sha256sum "$archive" | cut -d ' ' -f1)" \
            --kernel-iso "$RUNNER_TEMP/kernel.iso" "${tool_args[@]}"

  package-provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jyxxe/PsiOS'
    needs: [linux, host-package, guest-boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package
      - name: Match the tested artifacts to this main revision
        working-directory: ${{ runner.temp }}/psios-package
        run: |
          sha256sum --strict --check SHA256SUMS
          test "$(cat source-commit)" = "$GITHUB_SHA"
      - name: Attest the package and checksum manifest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/psios-package/psios-core_*_amd64.deb
            ${{ runner.temp }}/psios-package/SHA256SUMS
          create-storage-record: false
      - name: Retain the signed bundle with the build
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$RUNNER_TEMP/provenance.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psios-core-build-attestation
          path: ${{ runner.temp }}/provenance.jsonl
          if-no-files-found: error
          retention-days: 14

  verify-provenance:
    needs: package-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-build-attestation
          path: ${{ runner.temp }}/bundle
      - name: Verify the installed package inputs and reject tampering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="$RUNNER_TEMP/psios-package"
          bundle="$RUNNER_TEMP/bundle/provenance.jsonl"
          tools/verify-host-package "$package" "$GITHUB_SHA" "$bundle"
          gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
          sudo unshare --net runuser -u "$(id -un)" -- env GH_TOKEN=offline \
            tools/verify-host-package "$package" "$GITHUB_SHA" "$bundle" "$RUNNER_TEMP/trusted_root.jsonl"
          deb=("$package"/psios-core_*.deb)
          printf '\037' >> "${deb[0]}"
          if tools/verify-host-package "$package" "$GITHUB_SHA" "$bundle"; then
            echo 'Modified package unexpectedly verified' >&2
            exit 1
          fi
