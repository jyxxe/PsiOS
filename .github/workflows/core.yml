name: PsiOS Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: psios-core-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Format and lint
        run: |
          cargo +1.100.0 fmt --all --check
          cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and run Rust contract and recovery tests
        run: |
          cargo +1.100.0 build --locked --workspace
          cargo +1.100.0 test --locked --workspace
      - name: Exercise a real OCI engine and persistent volume
        run: PSIOS_TEST_OCI_KERNEL_LIMITS=1 python3 tests/oci.py
      - name: Verify documentation contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/psios-docs"
          "$RUNNER_TEMP/psios-docs/bin/pip" install -r docs/v1/tools/requirements.txt
          python3 docs/releases/restore_v1.py --verify-current
          "$RUNNER_TEMP/psios-docs/bin/python" docs/v1/tools/validate_package.py
      - name: Test local system API and process recovery
        run: |
          python3 tests/system.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Kill a restore at its filesystem publication boundary and reconcile it
        run: |
          if ! command -v strace; then
            sudo timeout 180 apt-get install -y --no-install-recommends strace
          fi
          PSIOS_TEST_RESTORE_RENAME_FAULT=1 python3 -B -m unittest discover -s tests \
            -p test_storage_recovery.py -k checkpointed_unpublished_restore -v
      - name: Kill offline state compaction after the SQLite WAL commit
        run: |
          PSIOS_TEST_STATE_COMPACTION_CUT=1 python3 -B -m unittest discover -s tests \
            -p test_state_compaction.py -k test_sigkill -v
      - name: Refuse a stale service settlement after replacing a disposable systemd manager
        run: sudo -n /usr/bin/python3 -B tests/service_manager_epoch.py --bin-dir "$PWD/target/debug"
      - name: Revert and confirm approved network trials on an isolated spare link
        run: |
          network_env=("PATH=/usr/sbin:/usr/bin:/sbin:/bin")
          if [[ ! -x /usr/sbin/NetworkManager ]]; then
            network_tools="$RUNNER_TEMP/psios-network-tools"
            mkdir -p "$network_tools/archives/partial" "$network_tools/root"
            sudo timeout 180 apt-get -o "Dir::Cache::archives=$network_tools/archives" \
              --download-only --no-install-recommends install -y network-manager
            for package in "$network_tools"/archives/*.deb; do
              dpkg-deb -x "$package" "$network_tools/root"
            done
            network_env=("PATH=$network_tools/root/usr/sbin:/usr/sbin:/usr/bin:/sbin:/bin"
                         "LD_LIBRARY_PATH=$network_tools/root/usr/lib/x86_64-linux-gnu")
          fi
          mount_targets=()
          trap 'for directory in "${mount_targets[@]}"; do sudo rmdir -- "$directory"; done' EXIT
          for directory in /etc/NetworkManager /var/lib/NetworkManager; do
            if [[ ! -d "$directory" ]]; then
              sudo install -d -m 0755 "$directory"
              mount_targets+=("$directory")
            fi
          done
          for scenario in network_trial.py network_trial_abort.py; do
            sudo -n unshare --net --mount --uts --propagation private /usr/bin/env "${network_env[@]}" \
              /usr/bin/python3 -B "tests/$scenario" --bin-dir "$PWD/target/debug"
          done
      - name: Read live cgroup limits and verify pressure on a kernel without visible counters
        run: |
          sudo systemd-run --quiet --collect --wait --pipe --property=WorkingDirectory="$PWD" \
            --property=CPUQuota=30% --property=CPUQuotaPeriodSec=100ms --property=TasksMax=48 \
            --property=MemoryHigh=96M --property=MemoryMax=128M --property=MemorySwapMax=0 \
            /usr/bin/env PSIOS_TEST_PRESSURE_LIMITS=1 python3 -B -m unittest discover -s tests -p test_pressure.py -k test_real_kernel -v
          sudo unshare --mount --propagation private sh -ec '
            mount -t tmpfs -o size=1m,nodev,nosuid,noexec tmpfs /proc/pressure
            mount -t tmpfs -o size=1m,nodev,nosuid,noexec tmpfs /sys/fs/cgroup
            PSIOS_TEST_HIDE_PRESSURE=1 python3 -B -m unittest discover -s tests -p test_pressure.py -k test_real_kernel -v
          '
      - name: Verify layout identity across reuse, resize and device-mapper attachment
        run: |
          if ! command -v sfdisk || ! command -v dmsetup; then
            sudo timeout 180 apt-get install -y --no-install-recommends fdisk dmsetup
          fi
          sudo env PSIOS_TEST_BLOCK_LOOP=1 PSIOS_TEST_BLOCK_MAPPER=1 \
            python3 -B -m unittest discover -s tests -p test_block_layout.py -k test_loop -v
      - name: Pair and inspect real Tasks in headless Chrome
        run: PSIOS_TEST_SHELL_BROWSER=1 python3 -B -m unittest discover -s tests -p test_shell.py -k test_browser -v
      - name: Verify scoped IPv6 probes across a real private veth pair
        run: sudo unshare --net --propagation private python3 -B tests/network_probe_netns.py
      - name: Reset durable probe observations across real network namespaces
        run: |
          sudo unshare --net sh -ec '
            ip link set lo up
            PSIOS_TEST_PROBE_NETNS=1 python3 -B -m unittest discover -s tests -p test_network_probe_state.py -k test_real_netns -v
          '
      - name: Verify scoped addresses, routes and rules in a private Linux network namespace
        run: |
          sudo unshare --net sh -ec '
            ip link set lo up
            python3 -B -m unittest discover -s tests -p test_network.py -k test_route_lookup -v
          '
          sudo unshare --net --mount --propagation private sh -ec '
            ip link set lo up
            ip address add 192.0.2.1 peer 192.0.2.2/32 dev lo
            ip -6 address add 2001:db8::2/64 dev lo nodad
            ip link add psios-test type dummy
            ip link set psios-test up
            ip address add 198.51.100.2/24 dev psios-test
            ip -6 address add 2001:db8:1::2/64 dev psios-test nodad
            ip -4 route add default via 198.51.100.1 dev psios-test metric 23 table 1000
            ip -6 route add default via 2001:db8:1::1 dev psios-test metric 24 table 1000
            ip -6 route add 2001:db8:2::/64 from 2001:db8:1::/64 via 2001:db8:1::1 dev psios-test table 1000
            ip -4 route add blackhole 203.0.113.128/25 table 1000 metric 900
            ip -4 route add 203.0.113.0/25 table 1000 nexthop via 198.51.100.3 dev psios-test weight 1 nexthop via 198.51.100.4 dev psios-test weight 256
            ip -4 route add 192.0.2.0/24 via inet6 2001:db8:1::1 dev psios-test table 1000
            ip -4 nexthop add id 123 via 198.51.100.5 dev psios-test
            ip -4 route add 198.18.0.0/24 nhid 123 table 1000
            ip -4 route add 198.20.0.0/24 via 198.51.100.10 dev psios-test table 2000
            ip -4 route add 198.20.2.0/24 via 198.51.100.11 dev psios-test table 2000
            ip -6 route add 2001:db8:3::/64 via 2001:db8:1::1 dev psios-test table 2001
            ip -4 rule add priority 100 from 192.0.2.0/24 to 203.0.113.0/24 fwmark 0/255 lookup 1000
            ip -4 rule add priority 100 iif lo uidrange 1000-1010 ipproto tcp sport 10000-10020 dport 443 prohibit
            ip -4 rule add priority 200 goto 300
            ip -4 rule add priority 250 tun_id 9007199254740993 table 1000
            ip -4 rule add priority 270 l3mdev
            ip -4 rule add priority 300 oif lo table 254 suppress_prefixlength 0 suppress_ifgroup 5
            ip -6 rule add priority 120 not from 2001:db8:1::/64 to 2001:db8:2::/64 blackhole
            ip -4 rule add priority 60 to 198.20.0.0/24 fwmark 55 lookup 2000
            ip -4 rule add priority 61 to 198.20.1.0/24 prohibit
            ip -6 rule add priority 62 to 2001:db8:3::/64 ipproto tcp sport 20000 dport 443 lookup 2001
            ip -4 rule add priority 63 to 198.20.2.0/24 uidrange 4242-4242 lookup 2000
            PSIOS_TEST_MUTATE_ROUTES=1 PSIOS_TEST_MUTATE_RULES=1 python3 -B -m unittest discover -s tests -p test_network.py -v
            ref=$(mktemp)
            routes=$(mktemp)
            rules=$(mktemp)
            lookups=$(mktemp)
            trap "rm -f \"$ref\" \"$routes\" \"$rules\" \"$lookups\"" EXIT
            ip -j address show > "$ref"
            { printf "["; ip -j -N link show; printf ","; ip -j -N -4 route show table all;
              printf ","; ip -j -N -6 route show table all; printf "]\n"; } > "$routes"
            { printf "["; ip -j -N -4 rule show; printf ","; ip -j -N -6 rule show; printf "]\n"; } > "$rules"
            { printf "["; ip -j -N -4 route get 127.0.0.1; printf ",";
              ip -j -N -6 route get ::1; printf ","; ip -j -N -4 route get 198.20.0.7 mark 55; printf ",";
              ip -j -N -6 route get 2001:db8:3::5 from 2001:db8:1::2 ipproto tcp sport 20000 dport 443;
              printf ","; ip -j -N -4 route get 198.20.2.7 uid 4242; printf "]\n"; } > "$lookups"
            chown "$1" "$ref" "$routes" "$rules" "$lookups"
            uid=$(id -u "$1")
            gid=$(id -g "$1")
            mount -t tmpfs tmpfs /usr/sbin
            PSIOS_TEST_NETWORK_REFERENCE="$ref" PSIOS_TEST_ROUTE_REFERENCE="$routes" PSIOS_TEST_RULE_REFERENCE="$rules" \
              PSIOS_TEST_LOOKUP_REFERENCE="$lookups" \
              setpriv --reuid "$uid" --regid "$gid" --clear-groups \
              python3 -B -m unittest discover -s tests -p test_network.py -v
          ' psios-network "$(id -un)"
      - name: Export a real network artifact larger than one RPC frame
        run: |
          sudo unshare --net --mount --propagation private sh -ec '
            batch=$(mktemp)
            trap "rm -f \"$batch\"" EXIT
            ip link set lo up
            awk "BEGIN { for (i=1; i<=8000; i++) printf \"address add 2001:db8:abcd::%x/128 dev lo nodad\\n\", i }" > "$batch"
            ip -batch "$batch"
            uid=$(id -u "$1")
            gid=$(id -g "$1")
            mount -t tmpfs tmpfs /usr/sbin
            PSIOS_TEST_BULK_NETWORK=1 setpriv --reuid "$uid" --regid "$gid" --clear-groups \
              python3 -B -m unittest discover -s tests -p test_network.py -k test_large_real_interface_result -v
          ' psios-artifact "$(id -un)"
      - name: Verify in-place state upgrade from PR 1
        run: |
          mkdir "$RUNNER_TEMP/psios-previous"
          git archive 26b66ffe7df09525969679b65860f66b00c2698b Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-previous"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-previous/Cargo.toml" --target-dir "$RUNNER_TEMP/psios-previous/target"
          python3 tests/upgrade.py --previous-bin "$RUNNER_TEMP/psios-previous/target/debug"
      - name: Refuse crossing a real bind mount during volume capacity accounting
        run: |
          sudo unshare --mount --propagation private env PSIOS_TEST_VOLUME_BIND=1 \
            python3 -B -m unittest discover -s tests -p test_volume_usage.py -k test_mount_boundary -v
          sudo unshare --mount --propagation private env PSIOS_TEST_VOLUME_BIND=1 \
            python3 -B -m unittest discover -s tests -p test_volume_file_integrity.py -k test_mount_boundary -v
      - name: Observe real tmpfs, bind, mount flags and path bytes in a private namespace
        run: |
          sudo unshare --mount --propagation private env PSIOS_TEST_MOUNT_TOPOLOGY=1 \
            python3 -B -m unittest discover -s tests -p test_mounts.py -k test_private_tmpfs -v
      - name: Exercise authority backpressure on a bounded Linux filesystem
        run: |
          scratch=$(mktemp -d)
          trap 'rmdir "$scratch"' EXIT
          sudo unshare --mount --propagation private sh -ec '
            mount -t tmpfs -o size=32m,nr_inodes=512,mode=1777 tmpfs "$1"
            trap "umount \"$1\"" EXIT
            TMPDIR="$1" PSIOS_TEST_CAPACITY_ALLOCATION=1 runuser -u "$2" -- \
              python3 -B -m unittest discover -s tests -p test_platform.py -k test_pauses_new_work -v
            TMPDIR="$1" PSIOS_TEST_CAPACITY_ALLOCATION=1 runuser -u "$2" -- \
              python3 -B -m unittest discover -s tests -p test_backup.py -k test_restore_preflights -v
            TMPDIR="$1" PSIOS_TEST_CAPACITY_ALLOCATION=1 runuser -u "$2" -- \
              python3 -B -m unittest discover -s tests -p test_storage_reserve.py -v
            TMPDIR="$1" PSIOS_TEST_CAPACITY_ALLOCATION=1 runuser -u "$2" -- \
              python3 -B -m unittest discover -s tests -p test_schedule.py -k test_waits_for_authority -v
            TMPDIR="$1" PSIOS_TEST_CAPACITY_ALLOCATION=1 runuser -u "$2" -- \
              python3 -B -m unittest discover -s tests -p test_chat.py -k test_low_disk -v
          ' psios-headroom "$scratch" "$(id -un)"
      - name: Verify backup restore and export filesystem limits
        run: |
          scratch=$(mktemp -d)
          trap 'rmdir "$scratch"' EXIT
          sudo unshare --mount --propagation private sh -ec '
            mount -t tmpfs -o size=1m,nr_inodes=256,mode=0700 tmpfs "$1"
            PSIOS_TEST_DETACHED_TARGET="$1" python3 -B -m unittest discover -s tests -p test_detached_backup.py -k test_full_target -v
            umount "$1"
            mount -t tmpfs -o size=128k,nr_inodes=256,mode=0700 tmpfs "$1"
            PSIOS_TEST_EXPORT_TARGET="$1" python3 -B -m unittest discover -s tests -p test_backup_export.py -k test_export_capacity -v
            umount "$1"
            mount -t tmpfs -o size=5m,nr_inodes=256,mode=0700 tmpfs "$1"
            PSIOS_TEST_EXPORT_RESUME_TARGET="$1" python3 -B -m unittest discover -s tests -p test_backup_export.py -k test_resumed_preflight -v
          ' psios-detached "$scratch"
      - name: Migrate active and completed model calls from format 4
        run: |
          mkdir "$RUNNER_TEMP/psios-format4"
          git archive 0287ebb3208b00f091ef51977d58d215ad32f47a Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format4"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-format4/Cargo.toml"
          python3 tests/model_leases.py --previous-bin "$RUNNER_TEMP/psios-format4/target/debug"
      - name: Settle a live format 5 reservation across a binary upgrade
        run: |
          mkdir "$RUNNER_TEMP/psios-format5"
          git archive 3bae1ad06d073903c3ab910323bec57152b913c2 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format5"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-format5/Cargo.toml" --target-dir "$RUNNER_TEMP/psios-format5/target"
          python3 tests/model_usage_upgrade.py --previous-bin "$RUNNER_TEMP/psios-format5/target/debug"
      - name: Upgrade the existing tool catalog and verify retained volume manifests
        run: |
          mkdir "$RUNNER_TEMP/psios-last-format5"
          git archive f9a74d4a1175eaa7eb95349320fe845cde918d99 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-last-format5"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-last-format5/Cargo.toml" --target-dir "$RUNNER_TEMP/psios-last-format5/target"
          python3 tests/network_routes_upgrade.py --previous-bin "$RUNNER_TEMP/psios-last-format5/target/debug"
          python3 tests/backup_times_upgrade.py --previous-bin "$RUNNER_TEMP/psios-format5/target/debug" --format5-writer-bin "$RUNNER_TEMP/psios-last-format5/target/debug"
      - name: Upgrade the format 7 routing catalog while retaining prior route cursors
        run: |
          mkdir "$RUNNER_TEMP/psios-format7"
          git archive 412eb56ea36930f75e713288d8833deabf92343e Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format7"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format7" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/network_rules_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Migrate format 8 state and dispatch a scheduled Task
        run: |
          mkdir "$RUNNER_TEMP/psios-format8"
          git archive c43ac95ae95b7918f79e8e352deeef5c57ba684c Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format8"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format8" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/schedule_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Migrate format 9 state with a pending timer and exercise kernel lookup
        run: |
          mkdir "$RUNNER_TEMP/psios-format9"
          git archive 121a8c1e11e0f34bcfec4a356a0a36f511731db1 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format9"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format9" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/route_lookup_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Migrate a format 10 timer and exercise interval trigger history
        run: |
          mkdir "$RUNNER_TEMP/psios-format10"
          git archive 918d80c9be636fe7a6eab287939cf8bc7df86c23 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format10"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format10" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/schedule_repeat_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Migrate format 11 and execute an authorized local workflow
        run: |
          mkdir "$RUNNER_TEMP/psios-format11"
          git archive ad512d24f0f6dfbbd69c6e68b3c29de3efa1798e Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format11"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format11" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/workflow_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Migrate format 12 and exercise direct chat with a retained workflow
        run: |
          mkdir "$RUNNER_TEMP/psios-format12"
          git archive afb73c71ce7a75b3cc7fa89c7d41c8d52dc828c0 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format12"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format12" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/chat_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Retain pending timers and direct chat when migrating format 13
        run: |
          mkdir "$RUNNER_TEMP/psios-format13"
          git archive 6735900e933346ec944fea285cf3358495e8ea62 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format13"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format13" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/calendar_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Upgrade the volume usage catalog without widening existing grants
        run: |
          mkdir "$RUNNER_TEMP/psios-format14"
          git archive 9d40b0a24e2b93bed7615739c9f8f5bbc63a13c8 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format14"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format14" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/volume_usage_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Publish mount topology without widening format 15 inventory grants
        run: |
          mkdir "$RUNNER_TEMP/psios-format15"
          git archive 588cb54ddde884db6350d989db87f58fc4b88a93 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format15"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format15" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/mounts_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Preserve format 19 private messages, send windows and read positions
        run: |
          mkdir "$RUNNER_TEMP/psios-format19"
          git archive d46adb502897e915b24abd78148c2b8287cb1713 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format19"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format19" "$RUNNER_TEMP/psios-compatibility-target"
          python3 tests/rooms_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Upgrade format 20 and require an explicit grant to probe the network
        run: |
          mkdir "$RUNNER_TEMP/psios-format20"
          git archive 2f67646aab1edebe83cd9b813421179029bc3123 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format20"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format20" "$RUNNER_TEMP/psios-compatibility-target"
          python3 -B tests/network_probe_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Upgrade format 21 and require a new grant to read resource pressure
        run: |
          mkdir "$RUNNER_TEMP/psios-format21"
          git archive d7c08a36454bae006d5eb08b0229eab9f1c159f1 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format21"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format21" "$RUNNER_TEMP/psios-compatibility-target"
          python3 -B tests/pressure_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Upgrade format 22 and keep existing device inventory grants scoped
        run: |
          mkdir "$RUNNER_TEMP/psios-format22"
          git archive 0e1c6be464906583f79c4c709209610a2e78f2a4 Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format22"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format22" "$RUNNER_TEMP/psios-compatibility-target"
          python3 -B tests/block_layout_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Preserve a pending format 23 workflow and fence old writers before conditional execution
        run: |
          mkdir "$RUNNER_TEMP/psios-format23"
          git archive 0f7b52c1ffea0621a0685dc6ebf09e6bdcec57de Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-format23"
          tools/build-compatibility-core "$RUNNER_TEMP/psios-format23" "$RUNNER_TEMP/psios-compatibility-target"
          python3 -B tests/workflow_conditions_upgrade.py --previous-bin "$RUNNER_TEMP/psios-compatibility-target/debug"
      - name: Keep format 24 grants and enforce new deadlines across time namespaces
        run: |
