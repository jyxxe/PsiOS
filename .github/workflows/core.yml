name: PsiOS Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: psios-core-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Format and lint
        run: |
          cargo +1.100.0 fmt --all --check
          cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and run Rust contract and recovery tests
        run: |
          cargo +1.100.0 build --locked --workspace
          cargo +1.100.0 test --locked --workspace
      - name: Verify documentation contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/psios-docs"
          "$RUNNER_TEMP/psios-docs/bin/pip" install -r docs/v1/tools/requirements.txt
          python3 docs/releases/restore_v1.py
          "$RUNNER_TEMP/psios-docs/bin/python" docs/v1/tools/validate_package.py
      - name: Test local system API and process recovery
        run: |
          python3 tests/system.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify scoped addresses in a private Linux network namespace
        run: |
          sudo unshare --net sh -ec '
            ip link set lo up
            ip address add 192.0.2.1 peer 192.0.2.2/32 dev lo
            ip -6 address add 2001:db8::2/64 dev lo nodad
            runuser -u "$1" -- python3 -m unittest discover -s tests -p test_network.py -v
          ' psios-network "$(id -un)"
      - name: Verify in-place state upgrade from PR 1
        run: |
          mkdir "$RUNNER_TEMP/psios-previous"
          git archive 26b66ffe7df09525969679b65860f66b00c2698b Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-previous"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-previous/Cargo.toml" --target-dir "$RUNNER_TEMP/psios-previous/target"
          python3 tests/upgrade.py --previous-bin "$RUNNER_TEMP/psios-previous/target/debug"
      - name: Verify real systemd service control and crash reconciliation
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          python3 tests/services.py
      - name: Exercise a real OCI engine and persistent volume
        run: python3 tests/oci.py

  host-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install package build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends debhelper
          rustup show active-toolchain
      - name: Build the original packaged Core and the current package
        run: |
          # The historical test harness forks while other tests own locks.
          RUST_TEST_THREADS=1 tools/build-host-package "$RUNNER_TEMP/psios-previous-package" 73421114b0a2751bb89b6ab95873fcda5d3ef85f
          tools/build-host-package "$RUNNER_TEMP/psios-package"
      - name: Exercise the installed system service across a real package upgrade
        run: |
          (cd "$RUNNER_TEMP/psios-package" && sha256sum -c SHA256SUMS)
          sudo tests/debian-install.sh --disposable-systemd-host \
            "$RUNNER_TEMP"/psios-previous-package/psios-core_*.deb "$RUNNER_TEMP"/psios-package/psios-core_*.deb
      - name: Retain the tested amd64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package/
          if-no-files-found: error
          retention-days: 14

  guest-boot:
    needs: host-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-ubuntu-24.04-amd64
          path: ${{ runner.temp }}/psios-package
      - name: Prepare the pinned guest base and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage seabios ovmf acl
          if [ -c /dev/kvm ]; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi
          (cd "$RUNNER_TEMP/psios-package" && sha256sum -c SHA256SUMS)
          curl --fail --location --retry 3 "$(jq -r .url images/qemu/base.json)" -o "$RUNNER_TEMP/base.img"
      - name: Boot BIOS and UEFI nodes and recover after abrupt VM loss
        run: python3 tests/qemu_boot.py --base "$RUNNER_TEMP/base.img" --package "$RUNNER_TEMP"/psios-package/psios-core_*.deb
