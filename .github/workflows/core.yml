name: PsiOS Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - name: Format and lint
        run: |
          cargo +1.100.0 fmt --all --check
          cargo +1.100.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and run Rust contract and recovery tests
        run: |
          cargo +1.100.0 build --locked --workspace
          cargo +1.100.0 test --locked --workspace
      - name: Verify documentation contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/psios-docs"
          "$RUNNER_TEMP/psios-docs/bin/pip" install -r docs/v1/tools/requirements.txt
          python3 docs/releases/restore_v1.py
          "$RUNNER_TEMP/psios-docs/bin/python" docs/v1/tools/validate_package.py
      - name: Test local system API and process recovery
        run: |
          python3 tests/system.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify in-place state upgrade from PR 1
        run: |
          mkdir "$RUNNER_TEMP/psios-previous"
          git archive 26b66ffe7df09525969679b65860f66b00c2698b Cargo.toml Cargo.lock rust-toolchain.toml crates docs/v1/schemas | tar -x -C "$RUNNER_TEMP/psios-previous"
          cargo build --locked --workspace --manifest-path "$RUNNER_TEMP/psios-previous/Cargo.toml" --target-dir "$RUNNER_TEMP/psios-previous/target"
          python3 tests/upgrade.py --previous-bin "$RUNNER_TEMP/psios-previous/target/debug"
      - name: Verify real systemd service control and crash reconciliation
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          python3 tests/services.py
      - name: Exercise a real OCI engine and persistent volume
        run: python3 tests/oci.py

  host-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install package build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends debhelper
          rustup show active-toolchain
      - name: Build and test the native Core package
        # rustup supplies the workspace toolchain outside dpkg's database.
        run: dpkg-buildpackage -b -us -uc -d
      - name: Exercise the installed system service across upgrade and removal
        run: sudo tests/debian-install.sh --disposable-systemd-host ../psios-core_*.deb
