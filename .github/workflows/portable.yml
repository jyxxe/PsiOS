name: PsiOS standalone Core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: psios-portable-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build standalone amd64 binaries with the Alpine musl toolchain
        run: |
          umask 077
          tools/build-portable-core "$RUNNER_TEMP/psios-core-linux-amd64.tar.gz"
      - name: Run system API, recovery, Shell and host observation tests as an offline user
        run: |
          mkdir "$RUNNER_TEMP/standalone"
          cd "$RUNNER_TEMP/standalone"
          tar -xzf "$RUNNER_TEMP/psios-core-linux-amd64.tar.gz"
          sha256sum --strict --check SHA256SUMS
          test "$(cat source-commit)" = "$GITHUB_SHA"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,src=$PWD,dst=/core,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tests,dst=/tests,readonly" \
            --env PSIOS_TEST_BIN_DIR=/core \
            python@sha256:f9a9704946281a492ad813560c8fd26d81bd9b81197db8acea2c0e46d18b713d \
            sh -ec 'python3 -B /tests/system.py --bin-dir /core &&
              python3 -B -m unittest discover -s /tests -p test_mcp_stdio.py -v &&
              python3 -B -m unittest discover -s /tests -p test_mcp_modern_stdio.py -v &&
              python3 -B -m unittest discover -s /tests -p test_shell.py -v &&
              python3 -B -m unittest discover -s /tests -p test_network_probe.py -k test_dns_mismatch -v &&
              python3 -B -m unittest discover -s /tests -p test_pressure.py -v &&
              python3 -B -m unittest discover -s /tests -p test_block_layout.py -v &&
              python3 -B -m unittest discover -s /tests -p test_detached_backup.py -v &&
              python3 -B -m unittest discover -s /tests -p test_backup_export.py -v &&
              python3 -B -m unittest discover -s /tests -p test_backup_intake.py -v &&
              python3 -B -m unittest discover -s /tests -p test_storage_retirement.py -v &&
              python3 -B -m unittest discover -s /tests -p test_backup_limits.py -v &&
              python3 -B -m unittest discover -s /tests -p test_project_work_items.py -v &&
              python3 -B -m unittest discover -s /tests -p test_project_directory.py -v &&
              python3 -B -m unittest discover -s /tests -p test_work_item_maintenance.py -v &&
              python3 -B -m unittest discover -s /tests -p test_agent_work_item_evidence.py -v &&
              python3 -B -m unittest discover -s /tests -p test_work_item_history.py -v &&
              python3 -B -m unittest discover -s /tests -p test_project_milestones.py -v &&
              python3 -B -m unittest discover -s /tests -p test_work_item_workflow_evidence.py -v &&
              python3 -B -m unittest discover -s /tests -p test_work_item_hierarchy.py -v &&
              python3 -B -m unittest discover -s /tests -p test_task_result_eviction_batch.py -v &&
              python3 -B -m unittest discover -s /tests -p test_result_eviction_candidates.py -v &&
              python3 -B -m unittest discover -s /tests -p test_agent_assigned_work.py -v &&
              python3 -B -m unittest discover -s /tests -p test_work_item_priority.py -v &&
              python3 -B -m unittest discover -s /tests -p test_authority_checkpoint.py -v &&
              python3 -B -m unittest discover -s /tests -p "test_secret_*.py" -v'
      - name: Recover a durable Task in an empty Linux userspace
        run: |
          python3 tests/portable_recovery.py "$RUNNER_TEMP/psios-core-linux-amd64.tar.gz" \
            python@sha256:f9a9704946281a492ad813560c8fd26d81bd9b81197db8acea2c0e46d18b713d
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psios-core-linux-amd64
          path: ${{ runner.temp }}/psios-core-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14

  rescue-disk:
    needs: portable-core
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-linux-amd64
          path: ${{ runner.temp }}/rescue-core
      - name: Download and configure rescue VM prerequisites
        run: |
          packages=(qemu-system-x86 qemu-utils genisoimage cpio e2fsprogs fdisk acl dnsmasq-base gcc libc6-dev
                    xorriso grub-common grub-efi-amd64-bin dosfstools mtools ovmf seabios openssl openssh-client strace)
          missing=()
          for pkg in "${packages[@]}"; do
            if [[ $(dpkg-query -W -f='${db:Status-Status}' "$pkg" 2>/dev/null) != installed ]]; then missing+=("$pkg"); fi
          done
          if (( ${#missing[@]} )); then
            install=(install -y --no-install-recommends "${missing[@]}")
            if ! sudo timeout 240 tools/ci-ubuntu-apt --download-only "${install[@]}"; then
              sudo timeout 180 tools/ci-ubuntu-apt update -q
              sudo timeout 300 tools/ci-ubuntu-apt --download-only "${install[@]}"
            fi
            sudo timeout 180 tools/ci-ubuntu-apt --no-download "${install[@]}"
          fi
          if [ -c /dev/kvm ]; then sudo setfacl -m "u:$(id -un):rw" /dev/kvm; fi

      - name: Verify the compressed native member and cpio error propagation
        run: python3 -B -m unittest discover -s tests -p test_native_ramfs.py -v

      - name: Inspect real ext4 images from an independent read-only rescue boot
        run: |
          cd "$RUNNER_TEMP/rescue-core"
          tar -xzf psios-core-linux-amd64.tar.gz
          sha256sum --strict --check SHA256SUMS
          cd "$GITHUB_WORKSPACE"
          curl --fail --location --retry 3 "$(jq -r .url "$RUNNER_TEMP/rescue-core/rescue/base.json")" -o "$RUNNER_TEMP/rescue.iso"
          python3 tests/rescue_disk.py --bin-dir "$RUNNER_TEMP/rescue-core" --iso "$RUNNER_TEMP/rescue.iso" \
            --inspector "$RUNNER_TEMP/rescue-core/rescue/inspect.py" --firmware-media

      - name: Boot an installed PsiOS UEFI disk, power-cut the node and verify its recovery
        run: |
          python3 tests/native_disk.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --psiosd "$RUNNER_TEMP/rescue-core/psiosd" --inspector "$RUNNER_TEMP/rescue-core/rescue/inspect.py"

      - name: Recover both DST fold occurrences on a UEFI disk after power cuts
        run: |
          python3 tests/native_calendar.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Install to an isolated blank block device, recover missing receipts and boot it
        run: |
          if [[ ! -c /dev/loop-control ]]; then sudo modprobe loop; fi
          sudo -n python3 -B tests/native_install.py \
            --installer "$RUNNER_TEMP/rescue-core/native/install.py" \
            --builder "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Enforce native Core cgroup quotas and retain them during upgrade
        run: |
          python3 -B tests/native_core_limits.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Verify kernel evidence, task waits, backup export and private PTYs in one guest
        run: |
          python3 -B tests/native_combined_core.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Acquire and release a real DHCP lease on the configured virtio NIC
        run: |
          sudo unshare --net --propagation private runuser -u "$(id -un)" -- \
            python3 tests/native_dhcp.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Install and renew DHCPv4 classless routes over an isolated TAP
        run: |
          sudo unshare --net --propagation private \
            python3 tests/native_dhcp_routes.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Bind one native system disk and refuse duplicate or split filesystems
        run: |
          python3 tests/native_storage.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Authenticate the native SSH console and preserve its host key across recovery and upgrade
        run: |
          python3 -B tests/native_ssh_console.py --staged --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Recover native authority enrollment across power cuts
        run: |
          python3 tests/native_enrollment.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Expire a scoped grant and queued Task after real UTC rollback in a guest
        run: |
          python3 -B tests/native_grant_deadline.py --installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Trial-boot an isolated UEFI upgrade and boot both production generations
        run: |
          mkdir "$RUNNER_TEMP/native-format5"
          prior="$RUNNER_TEMP/native-format5/core.tar.gz"
          tools/build-portable-core "$prior" f9a74d4a1175eaa7eb95349320fe845cde918d99
          tar -xzf "$prior" -C "$RUNNER_TEMP/native-format5"
          (cd "$RUNNER_TEMP/native-format5" && sha256sum --strict --check SHA256SUMS)
          python3 tests/native_upgrade.py --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$prior" --previous-installer "$RUNNER_TEMP/native-format5/native/create.py" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --installer "$RUNNER_TEMP/rescue-core/native/create.py"

      - name: Freeze one native source and publish a candidate after an isolated health proof
        run: |
          python3 -B tests/native_staged_update.py --large-authority \
            --controller "$RUNNER_TEMP/rescue-core/native/stage_update.py" \
            --previous-installer "$RUNNER_TEMP/native-format5/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz"

      - name: Verify managed native activation, deployment selection and boot crash fencing
        run: |
          prior_activation="$RUNNER_TEMP/native-prior-activation"
          mkdir -m 0700 "$prior_activation"
          git archive d38f0bbba1c5714c36e79d36c4e8115875dfe986 images/native images/rescue | tar -x -C "$prior_activation"
          python3 -B tests/native_activation.py \
            --controller "$RUNNER_TEMP/rescue-core/native/stage_update.py" \
            --activator "$RUNNER_TEMP/rescue-core/native/activate_update.py" \
            --selector "$RUNNER_TEMP/rescue-core/native/select_update.py" \
            --previous-installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --prior-activator "$prior_activation/images/native/activate_update.py" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --expected-source-format 5 --check-unclean-shutdown

      - name: Keep larger native state and home partitions through a crash and upgrade
        run: |
          python3 tests/native_capacity.py --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --installer "$RUNNER_TEMP/rescue-core/native/create.py"

      - name: Configure static IPv4, preserve healthy settings and refuse an invalid offline upgrade
        run: |
          previous="$RUNNER_TEMP/native-pre-static-installer"
          mkdir "$previous"
          git archive a7e20f07b9b59a7d0f745248ac65749dfb50a39a images/native images/rescue | tar -x -C "$previous"
          sudo unshare --net --propagation private \
            python3 -B tests/native_static_ipv4.py --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --previous-installer "$previous/images/native/create.py" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --installer "$RUNNER_TEMP/rescue-core/native/create.py"

      - name: Verify static IPv6 and dual stack, duplicate detection and offline upgrade
        run: |
          sudo unshare --net --propagation private \
            python3 -B tests/native_static_ipv6.py --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --installer "$RUNNER_TEMP/rescue-core/native/create.py"

      - name: Verify native Secure Boot, signed trial, firmware rejection and offline upgrade
        run: |
          secure_tools="$RUNNER_TEMP/psios-secure-boot-tools"
          mkdir "$secure_tools"
          (
            cd "$secure_tools"
            packages=(systemd-boot-efi systemd-ukify python3-pefile python3-virt-firmware python3-cryptography python3-pkg-resources sbsigntool)
            archive_apt="$GITHUB_WORKSPACE/tools/ci-ubuntu-apt"
            if ! timeout 180 "$archive_apt" download "${packages[@]}"; then
              sudo timeout 180 "$archive_apt" update -q
              timeout 180 "$archive_apt" download "${packages[@]}"
            fi
            for package in ./*.deb; do dpkg-deb -x "$package" "$secure_tools/root"; done
          )
          export PATH="$secure_tools/root/usr/bin:$PATH"
          export PYTHONPATH="$secure_tools/root/usr/lib/python3/dist-packages"
          mkdir "$secure_tools/previous-installer"
          git archive def4f2a5551274b37dc5807bf081b666be26d3b5 images/native images/rescue \
            | tar -x -C "$secure_tools/previous-installer"
          /usr/bin/python3 -B tests/native_secure_boot.py \
            --efi-stub "$secure_tools/root/usr/lib/systemd/boot/efi/linuxx64.efi.stub" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --previous-installer "$secure_tools/previous-installer/images/native/create.py" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --installer "$RUNNER_TEMP/rescue-core/native/create.py"

      - name: Verify enrolled firmware enforcement before publishing signed native updates
        run: |
          secure_tools="$RUNNER_TEMP/psios-secure-boot-tools"
          export PATH="$secure_tools/root/usr/bin:$PATH"
          export PYTHONPATH="$secure_tools/root/usr/lib/python3/dist-packages"
          /usr/bin/python3 -B tests/native_signed_staged_update.py \
            --controller "$RUNNER_TEMP/rescue-core/native/stage_update.py" \
            --previous-installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --efi-stub "$secure_tools/root/usr/lib/systemd/boot/efi/linuxx64.efi.stub" \
            --expected-source-format 5

      - name: Activate and boot the selected signed disk and refuse setup-mode firmware
        run: |
          secure_tools="$RUNNER_TEMP/psios-secure-boot-tools"
          export PATH="$secure_tools/root/usr/bin:$PATH"
          export PYTHONPATH="$secure_tools/root/usr/lib/python3/dist-packages"
          /usr/bin/python3 -B tests/native_signed_activation.py \
            --controller "$RUNNER_TEMP/rescue-core/native/stage_update.py" \
            --activator "$RUNNER_TEMP/rescue-core/native/activate_update.py" \
            --selector "$RUNNER_TEMP/rescue-core/native/select_update.py" \
            --previous-installer "$RUNNER_TEMP/rescue-core/native/create.py" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" \
            --previous-archive "$RUNNER_TEMP/native-format5/core.tar.gz" \
            --archive "$RUNNER_TEMP/rescue-core/psios-core-linux-amd64.tar.gz" \
            --efi-stub "$secure_tools/root/usr/lib/systemd/boot/efi/linuxx64.efi.stub" \
            --expected-source-format 5

      - name: Boot independently exported signed rescue media and enforce read-only inspection
        run: |
          secure_tools="$RUNNER_TEMP/psios-secure-boot-tools"
          export PATH="$secure_tools/root/usr/bin:$PATH"
          export PYTHONPATH="$secure_tools/root/usr/lib/python3/dist-packages"
          /usr/bin/python3 -B tests/rescue_secure_boot.py \
            --efi-stub "$secure_tools/root/usr/lib/systemd/boot/efi/linuxx64.efi.stub" \
            --kernel-iso "$RUNNER_TEMP/rescue.iso" --bin-dir "$RUNNER_TEMP/rescue-core" \
            --inspector "$RUNNER_TEMP/rescue-core/rescue/inspect.py"

  local-inference:
    needs: portable-core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-linux-amd64
          path: ${{ runner.temp }}/inference-core
      - name: Verify the exact inference runtime, weights and Core archive
        run: |
          lab="$RUNNER_TEMP/inference-core"
          cd "$lab"
          tar -xzf psios-core-linux-amd64.tar.gz
          sha256sum --strict --check SHA256SUMS
          pins="$GITHUB_WORKSPACE/tests/fixtures/local-inference.json"
          for part in runtime model; do
            size=$(jq -r ".$part.size_bytes" "$pins")
            curl --fail --location --retry 3 --max-time 120 --max-filesize "$size" \
              "$(jq -r ".$part.url" "$pins")" --output "$part"
            test "$(stat -c %s "$part")" = "$size"
            printf '%s  %s\n' "$(jq -r ".$part.sha256" "$pins")" "$part" | sha256sum --strict --check
          done
          tar -xzf runtime
      - name: Run a real CPU model and its authorized tool task with external networking disabled
        run: |
          lab="$RUNNER_TEMP/inference-core"
          server=$(jq -r .runtime.executable tests/fixtures/local-inference.json)
          sudo unshare --net runuser -u "$(id -un)" -- python3 tests/local_inference.py \
            --bin-dir "$lab" --server "$lab/$server" --weights "$lab/model"

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jyxxe/PsiOS'
    needs: [portable-core, rescue-disk, local-inference]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-linux-amd64
          path: ${{ runner.temp }}/archive
      - name: Check the tested archive revision
        run: |
          revision=$(tar -xOzf "$RUNNER_TEMP/archive/psios-core-linux-amd64.tar.gz" source-commit)
          test "$revision" = "$GITHUB_SHA"
      - name: Attest the complete archive
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/archive/psios-core-linux-amd64.tar.gz
          create-storage-record: false
      - name: Retain the offline verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE" "$RUNNER_TEMP/provenance.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: psios-core-linux-amd64-attestation
          path: ${{ runner.temp }}/provenance.jsonl
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-linux-amd64
          path: ${{ runner.temp }}/archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psios-core-linux-amd64-attestation
          path: ${{ runner.temp }}/bundle
      - name: Verify the published bytes offline and reject a modified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/archive/psios-core-linux-amd64.tar.gz"
          bundle="$RUNNER_TEMP/bundle/provenance.jsonl"
          trust="$RUNNER_TEMP/trusted_root.jsonl"
          gh attestation trusted-root > "$trust"
          offline=(sudo unshare --net runuser -u "$(id -un)" -- env GH_TOKEN=offline)
          "${offline[@]}" tools/verify-portable-core "$archive" "$GITHUB_SHA" "$bundle" "$trust"
          printf x >> "$archive"
          if "${offline[@]}" tools/verify-portable-core "$archive" "$GITHUB_SHA" "$bundle" "$trust"; then
            echo 'Modified archive unexpectedly verified' >&2
            exit 1
          fi
