[package]
name = "psios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
psios-api = { path = "../psios-api" }
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ring = "0.17"
rustix = { version = "1", features = ["fs", "net", "process", "time"] }
signal-hook = "0.3"
tempfile = "3"
zeroize = "1"
