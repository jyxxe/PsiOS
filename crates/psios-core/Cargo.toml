[package]
name = "psios-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
psios-api = { path = "../psios-api", features = ["local-inference"] }
rusqlite = { version = "0.38", features = ["bundled", "serde_json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive"] }
ring = "0.17"
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
signal-hook = "0.3"
tempfile = "3"
zeroize = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
netlink-packet-core = "0.9"
netlink-packet-route = "0.34"
