<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PsiOS Shell</title>
  <link rel="stylesheet" href="/shell.css">
  <script type="module" src="/shell.js"></script>
</head>
<body>
  <main id="pairing" class="pairing">
    <section class="login" aria-labelledby="login-title">
      <p class="brand"><span aria-hidden="true">Ψ</span> PsiOS Shell</p>
      <h1 id="login-title">连接本机</h1>
      <form id="pair-form">
        <label for="code">终端中的一次性配对码</label>
        <input id="code" type="password" autocomplete="one-time-code" spellcheck="false" required maxlength="32">
        <button id="connect" class="primary" type="submit">连接</button>
      </form>
      <p id="pair-message" class="message" role="status"></p>
      <noscript>使用 Shell 需要启用 JavaScript。</noscript>
    </section>
  </main>
  <div id="workspace" class="workspace" hidden>
    <header class="desktop-bar">
      <p class="brand"><span aria-hidden="true">Ψ</span> PsiOS Shell</p>
      <span id="active-app">桌面</span>
      <div class="identity">
        <strong id="principal" aria-label="已连接的主体"></strong>
        <button id="logout" type="button">断开会话</button>
      </div>
    </header>
    <p id="status" class="desktop-status message" role="status"></p>
    <main id="desktop" class="desktop" aria-label="桌面">
      <p id="empty-desktop" class="empty-desktop">从 Dock 打开应用。</p>
      <section id="window-node" class="app-window" aria-labelledby="title-node" hidden>
        <header class="window-bar">
          <h1 id="title-node" tabindex="-1">节点管理</h1>
        </header>
        <div class="window-body">
          <p id="status-node" class="message" role="status"></p>
          <div id="node-view"></div>
        </div>
      </section>
      <section id="window-tasks" class="app-window" aria-labelledby="title-tasks" hidden>
        <header class="window-bar">
          <h1 id="title-tasks" tabindex="-1">任务中心</h1>
        </header>
        <div class="window-body">
          <p id="status-tasks" class="message" role="status"></p>
          <div class="columns">
            <div class="table-panel">
              <table>
                <thead><tr><th scope="col">任务 ID</th><th scope="col">快照修订</th></tr></thead>
                <tbody id="task-rows"></tbody>
              </table>
              <p id="tasks-empty" class="empty" hidden>当前没有可见任务。</p>
              <div class="pagination">
                <button id="previous" type="button">上一页</button>
                <button id="next" type="button">下一页</button>
              </div>
            </div>
            <section id="task-detail" class="card" aria-labelledby="detail-title" tabindex="-1" hidden>
              <header class="detail-header">
                <h2 id="detail-title">任务详情</h2>
                <button id="close-task" type="button">返回列表</button>
              </header>
              <div id="task-content" aria-live="polite"></div>
            </section>
          </div>
        </div>
      </section>
      <section id="window-applications" class="app-window" aria-labelledby="title-applications" hidden>
        <header class="window-bar">
          <h1 id="title-applications" tabindex="-1">应用管理</h1>
        </header>
        <div class="window-body">
          <p id="status-applications" class="message" role="status"></p>
          <div class="columns">
            <div class="table-panel">
              <table>
                <thead><tr><th scope="col">应用</th><th scope="col">状态</th></tr></thead>
                <tbody id="application-rows"></tbody>
              </table>
              <p id="applications-empty" class="empty" hidden>当前没有可见应用。</p>
              <div class="pagination" aria-label="应用列表分页">
                <button id="applications-previous" type="button" disabled>上一页</button>
                <button id="applications-next" type="button" disabled>下一页</button>
              </div>
            </div>
            <section id="application-detail" class="card" aria-labelledby="application-detail-title" tabindex="-1" hidden>
              <header class="detail-header">
                <h2 id="application-detail-title">应用版本</h2>
                <button id="close-application" type="button">返回列表</button>
              </header>
              <div id="application-content" aria-live="polite"></div>
              <div class="pagination" aria-label="应用版本分页">
                <button id="releases-previous" type="button" disabled>上一页</button>
                <button id="releases-next" type="button" disabled>下一页</button>
              </div>
            </section>
          </div>
        </div>
      </section>
      <section id="window-chat" class="app-window" aria-labelledby="title-chat" hidden>
        <header class="window-bar">
          <h1 id="title-chat" tabindex="-1">Agent Chat</h1>
        </header>
        <div class="window-body">
          <p id="status-chat" class="message" role="status"></p>
          <div class="columns">
            <div class="table-panel">
              <table>
                <thead><tr><th scope="col">会话</th><th scope="col">类型</th></tr></thead>
                <tbody id="chat-rows"></tbody>
              </table>
              <p id="chat-empty" class="empty" hidden>当前没有可见会话。</p>
              <div class="pagination" aria-label="会话列表分页">
                <button id="chat-previous" type="button" disabled>上一页</button>
                <button id="chat-next" type="button" disabled>下一页</button>
              </div>
            </div>
            <section id="chat-detail" class="card" aria-labelledby="chat-title" tabindex="-1" hidden>
              <header class="detail-header">
                <h2 id="chat-title">会话历史</h2>
                <button id="close-chat" type="button">返回列表</button>
              </header>
              <div id="chat-content" aria-live="polite"></div>
              <div class="pagination" aria-label="会话历史分页">
                <button id="chat-history-previous" type="button">较早消息</button>
                <button id="chat-history-next" type="button">较新消息</button>
              </div>
              <form id="chat-composer" class="chat-composer" hidden>
                <label for="chat-draft">消息</label>
                <textarea id="chat-draft" rows="3" maxlength="4096" required></textarea>
                <p id="chat-send-status" class="message" role="status"></p>
                <div class="chat-send-buttons">
                  <button id="chat-send" class="primary" type="submit">发送</button>
                  <button id="chat-forget" type="button" hidden>清除待确认内容</button>
                </div>
              </form>
            </section>
          </div>
        </div>
      </section>
      <section id="window-projects" class="app-window" aria-labelledby="title-projects" hidden>
        <header class="window-bar">
          <h1 id="title-projects" tabindex="-1">PsiFlow 项目</h1>
        </header>
        <div class="window-body">
          <p id="status-projects" class="message" role="status"></p>
          <div class="columns">
            <div class="table-panel">
              <table>
                <thead><tr><th scope="col">项目</th><th scope="col">角色</th></tr></thead>
                <tbody id="project-rows"></tbody>
              </table>
              <p id="projects-empty" class="empty" hidden>当前没有可见项目。</p>
              <div class="pagination" aria-label="项目分页">
                <button id="projects-previous" type="button" disabled>上一页</button>
                <button id="projects-next" type="button" disabled>下一页</button>
              </div>
            </div>
            <section id="project-detail" class="card" aria-labelledby="project-title" tabindex="-1" hidden>
              <header class="detail-header">
                <h2 id="project-title">工作项</h2>
                <button id="close-project" type="button">返回列表</button>
              </header>
              <div id="project-content" aria-live="polite"></div>
              <div class="pagination" aria-label="工作项分页">
                <button id="work-items-previous" type="button" disabled>上一页</button>
                <button id="work-items-next" type="button" disabled>下一页</button>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>
    <nav class="dock" aria-label="应用 Dock">
      <button id="nav-node" type="button" aria-controls="window-node" aria-expanded="false">节点管理</button>
      <button id="nav-tasks" type="button" aria-controls="window-tasks" aria-expanded="false">任务中心</button>
      <button id="nav-applications" type="button" aria-controls="window-applications" aria-expanded="false">应用管理</button>
      <button id="nav-chat" type="button" aria-controls="window-chat" aria-expanded="false">Agent Chat</button>
      <button id="nav-projects" type="button" aria-controls="window-projects" aria-expanded="false">PsiFlow 项目</button>
    </nav>
  </div>
  <template id="window-tools">
    <div class="window-tools">
      <button type="button" data-action="refresh">刷新</button>
      <button type="button" data-action="minimize">最小化</button>
      <button type="button" data-action="maximize">最大化</button>
      <button type="button" data-action="close">关闭</button>
    </div>
  </template>
</body>
</html>
